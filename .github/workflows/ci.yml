name: CI Build

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]
    types: [ opened, reopened, labeled, synchronize ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-formatting:

    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.action != 'labeled' # run for 'opened', 'reopened' and 'synchronize'

    name: Check formatting

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v3.0.3
        with:
          apps: scalafmt
      - name: Check code and docs formatting
        run: scalafmt --check

  check-snippets:

    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.action != 'labeled' # run for 'opened', 'reopened' and 'synchronize'

    name: Check Scala CLI snippets from documentation

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/coursier/v1
            ~/.cache/scalacli
            ~/.sbt
            ~/.ivy2/cache
          key: snippets-coursier-${{ runner.os }}-${{ hashFiles('docs/user-guide/*.md') }}
          restore-keys: |
            snippets-coursier-${{ runner.os }}-
      - uses: extractions/setup-just@v4
      - uses: coursier/setup-action@v3.0.3
        with:
          apps: scala-cli sbt
      - name: Run snippets from documentation
        working-directory: docs
        run: |
          scala-cli config power true
          just test-snippets
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            ~/.cache/coursier/v1
            ~/.cache/scalacli
            ~/.sbt
            ~/.ivy2/cache
          key: snippets-coursier-${{ runner.os }}-${{ hashFiles('docs/user-guide/*.md') }}

  build:

    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.action != 'labeled' # run for 'opened', 'reopened' and 'synchronize'

    strategy:
      matrix:
        scala: ['2_13', '3']
        platform: ['jvm', 'js', 'native']
        jvm: ['temurin:1.11.0.28', 'temurin:1.17.0.15', 'temurin:1.24.0.2', 'temurin:1.25.0.0']
        tier: ['lts', 'next-lts']  # 'next' (3.10-RC1) excluded until macro inference changes are addressed
        # Tier rows are JVM-only regression tests, not published.
        # Next tier is Scala 3 only (no 2.13 cross-compilation).
        # LTS Scala 3 runs on JDK 11+; tier rows need JDK 17+.
        exclude:
          # Next-LTS tier rows are JVM-only
          - tier: 'next-lts'
            platform: 'js'
          - tier: 'next-lts'
            platform: 'native'
          # Next-LTS tier needs JDK 17+
          - tier: 'next-lts'
            jvm: 'temurin:1.11.0.28'
          # LTS excludes (same as before)
          - scala: '2_13'
            jvm: 'temurin:1.25.0.0' # 2.13.16 does not work with JDK 25+
          - scala: '2_13'
            jvm: 'temurin:1.17.0.15' # No need to test 2.13 on JDK 17 separately
          - scala: '3'
            tier: 'lts'
            jvm: 'temurin:1.24.0.2' # Scala 3 LTS does not need a workaround
          - scala: '3'
            tier: 'lts'
            jvm: 'temurin:1.17.0.15' # JDK 17 not needed for LTS Scala 3
          # Avoid redundant Next-LTS x JDK combinations
          - tier: 'next-lts'
            jvm: 'temurin:1.24.0.2'
          - tier: 'next-lts'
            jvm: 'temurin:1.25.0.0'
      fail-fast: false

    name: "Scala: ${{ matrix.scala == '2_13' && '2.13' || '3' }} / Platform: ${{ matrix.platform }} / JVM: ${{ matrix.jvm }} / Tier: ${{ matrix.tier }}"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v8
      - uses: coursier/setup-action@v3.0.3
        with:
          jvm: ${{ matrix.jvm }}
          apps: sbt
      - name: "Clean, compile, test${{ matrix.tier == 'lts' && matrix.platform == 'jvm' && ', generate coverage report, check MiMa' || '' }}"
        run: |
          if [ "${{ matrix.tier }}" = "lts" ]; then
            sbt ci-${{ matrix.platform }}-${{ matrix.scala }}
          elif [ "${{ matrix.tier }}" = "next-lts" ]; then
            sbt quick-test-next-lts
          fi
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
